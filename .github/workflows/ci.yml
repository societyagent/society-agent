name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install anvil (a real EVM node for the contract-wallet tests)
        # Pinned release plus its published checksum, so a swapped binary fails the build instead of running.
        run: |
          set -e
          V=v1.8.6; B=https://github.com/foundry-rs/foundry/releases/download/$V
          curl -fsSL -o foundry.tgz "$B/foundry_${V}_linux_amd64.tar.gz"
          curl -fsSL -o foundry.sha256 "$B/foundry_${V}_linux_amd64.sha256"
          echo "$(cut -d' ' -f1 foundry.sha256)  foundry.tgz" | sha256sum -c -
          mkdir -p "$HOME/foundry" && tar -xzf foundry.tgz -C "$HOME/foundry" anvil
          echo "ANVIL_BIN=$HOME/foundry/anvil" >> "$GITHUB_ENV"
      - name: Typecheck, lint, unit tests
        run: npm test
      - name: Dependency audit (production + build tooling)
        timeout-minutes: 6
        # A real finding (exit 1) fails the build. If the advisory service does not answer in time we retry, then warn instead of hanging the pipeline.
        run: |
          for attempt in 1 2 3; do
            set +e; timeout 90 npm audit --audit-level=high; code=$?; set -e
            if [ "$code" = 0 ]; then echo "audit clean"; exit 0; fi
            if [ "$code" = 1 ]; then echo "::error::npm audit found vulnerabilities at high severity or above"; exit 1; fi
            echo "audit attempt $attempt did not finish (exit $code), retrying"; sleep 10
          done
          echo "::warning::the npm advisory service did not answer after 3 attempts; audit skipped for this run"
      - name: Production build
        run: npm run build
        env:
          VITE_REOWN_PROJECT_ID: ${{ vars.VITE_REOWN_PROJECT_ID }}
      - name: No secret values or provider names in the client bundle
        # Variable NAMES are public documentation. A VALUE, a key-shaped string, a private key or a provider name must never ship.
        run: |
          if grep -rIEi "sk-[A-Za-z0-9]{20,}|(AI_API_KEY|HEALTH_TOKEN|ALERT_WEBHOOK)[\"']?[[:space:]]*[:=][[:space:]]*[\"'\`][^\"'\`[:space:]]{8,}|BEGIN [A-Z ]*PRIVATE KEY|anthropic|openai|deepseek" dist; then
            echo "::error::a secret value or provider name is present in the client bundle"; exit 1
          fi
