name: Feature request
description: Suggest something that would make the simulation or the lab more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out or do
      description: Describe the question or workflow, not just the feature.
      placeholder: I want to compare two street plans when the news arrives in the evening
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Engine (rules, residents, maps)
        - Experiment Lab
        - Reports
        - App and dashboard
        - Docs
        - AI layer
        - API
        - Self-hosting and operations
        - Other
  - type: markdown
    attributes:
      value: The engine must stay deterministic, so ideas that need randomness should draw from the seeded generator.
